<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Central Park Pigeon GitHub preview</title>
<style>
  @font-face { font-family: 'Fredoka'; src: url('../game/fonts/Fredoka.ttf') format('truetype'); font-weight: 300 700; }
  html, body { margin: 0; padding: 0; }
  body { width: 1280px; height: 640px; overflow: hidden; position: relative; background: #c9a27a; }
  .bg { position: absolute; inset: -40px; background: url('../game/assets/ui/key-art.jpg') 0 0 / 2800px auto no-repeat; filter: blur(14px); }   /* the sky's top-left corner, stretched: no pigeon in it */
  .art { position: absolute; left: 0; right: 0; top: 64px; bottom: 0; background: url('../game/assets/ui/key-art.jpg') 60% 8% / 1290px auto no-repeat;
         -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 60px); mask-image: linear-gradient(to bottom, transparent 0, #000 60px); }
  .shade { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(25, 30, 45, 0.55) 0%, rgba(25, 30, 45, 0.25) 40%, rgba(0, 0, 0, 0) 62%); }
  .logo { position: absolute; left: 160px; top: 110px; margin: 0; color: #fff8ea; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: 96px; line-height: 0.92; letter-spacing: 0.5px;
          text-shadow: 0 5px 0 #b85e25, 0 9px 0 rgba(70, 35, 10, 0.5), 0 18px 36px rgba(0, 0, 0, 0.4); }
  .tag { position: absolute; left: 164px; top: 330px; width: 620px; color: #ffe9c4; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 28px; line-height: 1.18; letter-spacing: 1.5px;
         text-shadow: 0 2px 0 rgba(70, 35, 10, 0.6), 0 4px 14px rgba(0, 0, 0, 0.45); }
  .pill { position: absolute; left: 76px; top: 420px; padding: 12px 26px; border-radius: 40px; background: #E07B39; color: #fff8ea; font-family: 'Fredoka', sans-serif; font-weight: 600; font-size: 28px;
          box-shadow: 0 4px 0 #b85e25, 0 10px 24px rgba(0, 0, 0, 0.35); }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="art"></div>
  <div class="shade"></div>
  <h1 class="logo">Central Park<br>Pigeon</h1>
  <div class="tag">ONE PIGEON. SEVENTEEN CREWS.<br>ONE VERY LARGE ROBOT.</div>
</body>
</html>
