  <script>
    // M4, before the game's code so a broken game can't stop it: the last few errors (for bug
    // reports), Ctrl+Shift+L opens the report (feedback.md; L because F is Coo), and the offline
    // service worker (web-target.md: off on localhost unless ?sw=1).
    (function () {
      var errs = window.__errors = [];
      var keep = function (m) { errs.push(String(m).replace(/\s+/g, ' ').slice(0, 200)); errs.splice(0, errs.length - 5); };
      addEventListener('error', function (e) { keep(e.message || (e.target && e.target.src) || 'error'); }, true);
      addEventListener('unhandledrejection', function (e) { keep((e.reason && e.reason.message) || e.reason); });
      addEventListener('keydown', function (e) {
        if (!e.ctrlKey || !e.shiftKey || e.altKey || e.metaKey || e.key.toLowerCase() !== 'l') return;
        var fb = document.getElementById('report');
        if (!fb || !fb.getAttribute('repo') || document.activeElement === fb || !fb.open) return;
        e.preventDefault();
        e.stopImmediatePropagation();
        try { window.reportShortcut && window.reportShortcut(); } catch (err) { /* the game is stuck: open anyway */ }
        fb.open();
      }, true);
      var local = ['localhost', '127.0.0.1'].indexOf(location.hostname) >= 0;
      if ('serviceWorker' in navigator && (!local || new URLSearchParams(location.search).has('sw'))) {
        navigator.serviceWorker.register('sw.js').catch(function (e) { keep('service worker: ' + e.message); });
        // Fixes-1 (#7): a new version took over this page (it was already controlled, so this is an update, not the
        // first install). Before the title is up, reload at once; after, ui/offline.js decides (G.onSwUpdate).
        var had = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.addEventListener('controllerchange', function () {
          if (!had) { had = true; return; }
          window.__swUpdated = true;
          if (window.__onSwUpdate) window.__onSwUpdate(); else location.reload();
        });
      }
      // Fixes-1 (#9): the boot loads ~390 files; the default buffer keeps 250, and ui/offline.js reads it to tell
      // the service worker what to cache first
      if (performance.setResourceTimingBufferSize) performance.setResourceTimingBufferSize(2000);
    })();
  </script>

    #loading .shade { position: absolute; inset: 0; background: linear-gradient(100deg, rgba(25, 30, 45, 0.42) 0%, rgba(25, 30, 45, 0.12) 38%, rgba(0, 0, 0, 0) 60%); pointer-events: none; }
    #loading .logo { position: relative; z-index: 1; color: #fff8ea; margin: 0; line-height: 0.92; font-family: 'Fredoka', sans-serif; font-weight: 700; font-size: clamp(34px, min(8.2vw, 14vh), 104px); letter-spacing: 0.5px; text-shadow: 0 4px 0 #b85e25, 0 7px 0 rgba(70, 35, 10, 0.5), 0 14px 30px rgba(0, 0, 0, 0.35); }
    #loading .logo small { display: block; max-width: 44vw; font-size: 0.32em; letter-spacing: 1.5px; margin-top: 0.55em; color: #ffe9c4; text-shadow: 0 2px 0 rgba(70, 35, 10, 0.55); font-weight: 600; text-wrap: balance; }
    #loading .load { position: relative; z-index: 1; width: 250px; padding-top: 14px; }
    #loading .bar { height: 12px; border-radius: 6px; background: rgba(255, 250, 240, 0.55); box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25); overflow: hidden; }
    #loading-bar { height: 100%; width: 3%; border-radius: 6px; background: #E07B39; transition: width 0.25s; }

    @media (max-height: 500px) { #loading .load { width: 220px; } #loading .logo small { max-width: 60vw; } }
    /* Fixes-1: the words wait for Fredoka (no font swap) */
    #loading .logo, #loading-label, #loading .credit { visibility: hidden; }
    html.fonts-in #loading .logo, html.fonts-in #loading-label, html.fonts-in #loading .credit { visibility: visible; }

    #touch { position: fixed; inset: 0; z-index: 12; display: none; pointer-events: none; opacity: 0.55; }
    #touch.on { display: block; }
    #touch .stick, #touch .tb { pointer-events: auto; touch-action: none; }
    #touch .stick { position: absolute; left: calc(18px + env(safe-area-inset-left)); bottom: calc(18px + env(safe-area-inset-bottom)); width: 140px; height: 140px; border-radius: 50%; background: rgba(255, 255, 255, 0.35); border: 2px solid rgba(255, 255, 255, 0.7); }
    #touch .knob { position: absolute; left: 45px; top: 45px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255, 255, 255, 0.9); }
    #touch .tb { position: absolute; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.8); background: rgba(40, 40, 50, 0.45); color: #fff; font: 700 14px 'Fredoka', system-ui, sans-serif; }
    #touch .tb.down { background: rgba(224, 123, 57, 0.8); }

    #touch .dive { right: calc(128px + env(safe-area-inset-right)); bottom: calc(24px + env(safe-area-inset-bottom)); width: 72px; height: 72px; }
    #touch .peck { right: calc(28px + env(safe-area-inset-right)); bottom: calc(128px + env(safe-area-inset-bottom)); width: 80px; height: 80px; }
    #touch .coo { right: calc(118px + env(safe-area-inset-right)); bottom: calc(112px + env(safe-area-inset-bottom)); width: 72px; height: 72px; }

    #polaroid.on { opacity: 1; transform: translate(-50%, 0) rotate(-3deg); }
    #polaroid img { width: 150px; height: 150px; object-fit: cover; background: #d8cfc0; }

  <script>
    (function () {
      var show = function () { document.documentElement.classList.add('fonts-in'); };
      if (!document.fonts || !document.fonts.load) { show(); return; }
      document.fonts.load('700 40px Fredoka').then(show, show);
      setTimeout(show, 30000);   // never leave the loading screen wordless
    })();
  </script>
