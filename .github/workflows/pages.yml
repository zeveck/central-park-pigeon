name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Only the game folder is published. Stamp the service worker with this
      # version and the files to cache, each with its hash and size (so a new
      # deploy reuses unchanged files from the player's cache, and the worker can
      # check storage first). game/tools/stamp-sw.mjs leaves out the test fixtures,
      # test/ and tools/.
      - name: Stamp service worker
        run: |
          node game/tools/stamp-sw.mjs game "${GITHUB_SHA::12}"
          ! grep -q -e __FILES__ -e "'__BUILD__'" game/sw.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: game
      - id: deployment
        uses: actions/deploy-pages@v4
